# /etc/nginx/sites-available/swingdesk
# Single Ubuntu server behind Cloudflare (orange-cloud proxied DNS record).
# Cloudflare terminates public TLS; use a Cloudflare Origin Certificate here.

server {
    listen 443 ssl;
    server_name your-domain.example;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    # Static frontend (vite build output)
    root /opt/swingdesk/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;   # scans / backtests can take a while
    }

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    server_name your-domain.example;
    return 301 https://$host$request_uri;
}
